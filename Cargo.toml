[package]
name = "maplibre-contour-rs"
version = "0.1.1"
edition = "2021"
# Bumped from the scaffold's 1.75: the pinned `image`/`geozero` stack needs a
# newer compiler than that. CI builds on stable.
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Generate contour-line vector tiles (MVT) from raster-DEM tiles. A Rust port of maplibre-contour, intended to be embedded on Android/iOS."
repository = "https://github.com/mapeak-com/maplibre-contour-rs"
readme = "README.md"
keywords = ["mvt", "contour", "dem", "maplibre", "vector-tiles"]
categories = ["science::geo"]

# `cdylib` for the Android `.so`, `staticlib` for the iOS `.a`/xcframework,
# `lib` so the crate is still usable as a normal Rust dependency and in tests.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Decode the raster-DEM tile (Terrarium/Terrain-RGB ships as PNG or WebP).
# Pinned exact: image >= 0.25.6 raises its MSRV past what we target here.
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
# Geometry primitives passed to the MVT encoder.
geo-types = "0.7"
# geo-types -> MVT encoding bridge (and GeoJSON for debugging).
geozero = { version = "0.15", default-features = false, features = [
    "with-mvt",
    "with-geo",
    "with-geojson",
] }
# Error types.
thiserror = "2"
# LRU cache for decoded parent DEM tiles (mirrors maplibre-contour's cache).
lru = "0.18"
# Kotlin/Swift bindings. Always on: this crate is built primarily to be embedded
# on mobile (mirrors Mapeak-com/pmtiles-mobile). Note the *runtime* only — the
# `cli` feature (uniffi_bindgen + uniffi_udl + weedle/winnow/clap/toml) is gated
# behind our own `cli` feature below so the code generator never ends up linked
# into the shipped `.a`/`.so`.
uniffi = { version = "0.31" }

[features]
# Pulls in the `uniffi_bindgen` code generator. Only ever enabled for the
# `uniffi-bindgen` host binary — never when building the mobile library.
cli = ["uniffi/cli"]

# Generates the Kotlin/Swift sources from the compiled library. Build/run it with
# `cargo run --features cli --bin uniffi-bindgen`; `required-features` makes a
# plain `cargo build` skip it (and with it, all of uniffi's bindgen deps).
[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

[dev-dependencies]
# Add criterion here when you start benchmarking the hot path.

# Alternative MVT encoder if you outgrow geozero's writer:
# mvt = "0.10"

[profile.release]
# Mobile binaries care about size; tune as needed.
opt-level = 3
# LTO is deliberately OFF. `lto = "thin"` forces rustc to embed LLVM bitcode in
# every object (`__LLVM,__bitcode` on Mach-O), which dominated the published
# xcframework — 53 MB of the 71 MB ios-arm64 slice was bitcode. Apple dropped
# bitcode in Xcode 14 and `bitcode_strip` is a no-op in current Xcode, so it has
# to be prevented at codegen time: with LTO off, cargo passes
# `-C embed-bitcode=no` automatically. `codegen-units = 1` recovers most of the
# cross-crate optimization LTO would have given.
lto = false
codegen-units = 1
